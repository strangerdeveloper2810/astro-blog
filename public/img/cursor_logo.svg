<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Dark Rounded App Box -->
  <rect width="500" height="500" rx="110" fill="#000000"/>

  <!-- 3D Geometric Cube Pointer Logo for Cursor AI -->
  <g transform="translate(250, 250)">
    <!-- Cube Wireframe & Facets -->
    <path d="M 0,-140 L 120,-70 L 120,70 L 0,140 L -120,70 L -120,-70 Z" fill="#111827" stroke="#ffffff" stroke-width="6"/>
    <!-- Top White Arrow / Cursor Shape -->
    <polygon points="0,-140 120,-70 0,0 -120,-70" fill="#ffffff"/>
    <polygon points="0,0 120,-70 120,70 0,140" fill="#e5e7eb"/>
    <polygon points="0,0 -120,-70 -120,70 0,140" fill="#9ca3af"/>
    <!-- Highlight Overlay -->
    <polygon points="0,0 120,-70 0,-140" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
